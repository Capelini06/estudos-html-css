<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário de Classe</title>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js"></script>
</head>
<body>
    <main class="container">
        <h1>Diário de Classe</h1>

        <form>
            <label for="nome">Nome do aluno</label>
            <input type="text" id="nome" name="nome">

            <label for="nota1">Nota 1</label>
            <input type="number" id="nota1" name="nota1" min="0" max="10" step="0.1">

            <label for="nota2">Nota 2</label>
            <input type="number" id="nota2" name="nota2" min="0" max="10" step="0.1">

            <label for="frequencia">Frequência (%)</label>
            <input type="number" id="frequencia" name="frequencia" min="0" max="100">

            <div class="botoes">
                <button type="button" onclick="adicionarAluno()">Adicionar aluno</button>
                <button type="button" class="secundario" onclick="verResultado()">Ver resultado</button>
            </div>
        </form>

        <p id="contador">Alunos cadastrados: 0</p>

        <div id="resultado"></div>
    </main>
</body>
</html>
